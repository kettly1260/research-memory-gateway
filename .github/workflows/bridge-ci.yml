name: Bridge (Rust)

# Rust client CI: formatting, lints, tests, cross-platform binaries.
#
# The Python gateway keeps its own workflows (`tests.yml`, `docker-publish.yml`);
# this one is additive and never replaces them.  Formal bridge binaries are
# produced here, by GitHub Actions, never uploaded by hand.

on:
  pull_request:
  push:
    branches: ["main", "agents-b-through-h-roadmap"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # fmt + clippy + tests on the Linux runner
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('bridge/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        working-directory: bridge
        run: cargo fmt --check

      - name: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: bridge
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: bridge
        run: cargo test

  # ---------------------------------------------------------------------------
  # Release binaries for the platforms the user actually runs on
  # ---------------------------------------------------------------------------
  build-binaries:
    name: build ${{ matrix.target }}
    needs: lint-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: research-memory-bridge-windows-x86_64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: research-memory-bridge-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: research-memory-bridge-linux-aarch64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (native targets)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        working-directory: bridge
        run: cargo build --release --locked --target ${{ matrix.target }}

      # `cross` supplies the aarch64 linker toolchain; plain `cargo build` on the
      # runner would fail to link.
      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@cross

      - name: Build (cross target)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        working-directory: bridge
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        working-directory: bridge
        run: |
          set -euo pipefail
          staging="research-memory-bridge-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/research-memory-bridge" "$staging/"
          cp README.md "$staging/"
          tar -czf "${{ matrix.archive }}" "$staging"
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        working-directory: bridge
        shell: pwsh
        run: |
          $staging = "research-memory-bridge-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/research-memory-bridge.exe" $staging
          Copy-Item "README.md" $staging
          Compress-Archive -Path $staging -DestinationPath "${{ matrix.archive }}"
          $hash = (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"
          Get-Content "${{ matrix.archive }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-memory-bridge-${{ matrix.target }}
          path: |
            bridge/${{ matrix.archive }}
            bridge/${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Attach binaries + SHA256SUMS to the GitHub release for a v* tag
  # ---------------------------------------------------------------------------
  release:
    name: publish release assets
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: research-memory-bridge-*
          merge-multiple: true

      - name: Build SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          cat ./*.sha256 > SHA256SUMS
          # Normalise to "<hash>  <file>" and keep one line per artifact.
          awk '{print $1"  "$2}' SHA256SUMS | sort -k2 > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          rm -f ./*.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
