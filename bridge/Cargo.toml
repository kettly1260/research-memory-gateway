[package]
name = "research-memory-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Automatic conversation capture bridge for research-memory-gateway"
license = "MIT"
publish = false
readme = "README.md"

[[bin]]
name = "research-memory-bridge"
path = "src/main.rs"

[lib]
name = "research_memory_bridge"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
