[project]
name = "research-memory-gateway"
version = "0.2.7"
description = "A lightweight evidence-first MCP gateway for cross-tool scientific research memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "starlette>=0.40,<2.0",
  "httpx2>=2.5.0",
  "asgi-tus>=0.1.0",
  "tuspy>=1.1.0",
]

[project.scripts]
research-memory-gateway = "research_memory_gateway.server:main"
research-memory-admin = "research_memory_gateway.admin:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
