server:
  name: research-memory-gateway
  host: 127.0.0.1
  port: 8787
  auth_token_env: RESEARCH_MEMORY_TOKEN
  # agent: recall/capture/verify/project-state plus Research Media tools
  # admin: legacy evidence-first management tools only
  # full: both surfaces, intended for debugging/migration
  surface: agent

backend:
  # Default self-contained backend. This is enough for direct MCP calls.
  # Nocturne is not required; keep SQLite when you already have embedding/rerank services.
  type: sqlite
  sqlite_path: ./data/research_memory.db
  nocturne_url_env: NOCTURNE_URL
  nocturne_token_env: NOCTURNE_TOKEN

retrieval:
  # keyword: SQLite FTS only.
  # hybrid: SQLite FTS + optional external embedding model + optional rerank model.
  mode: keyword
  vector_candidate_limit: 50
  rerank_candidate_limit: 20
  embedding:
    enabled: false
    base_url_env: EMBEDDING_BASE_URL
    api_key_env: EMBEDDING_API_KEY
    model_env: EMBEDDING_MODEL
    # Supports EMBEDDING_BASE_URL ending in either the server root or /v1.
    # If /embeddings returns 404, the client also tries /v1/embeddings.
    endpoint_path: /embeddings
    timeout_seconds: 30
    max_retries: 1
  rerank:
    enabled: false
    base_url_env: RERANK_BASE_URL
    api_key_env: RERANK_API_KEY
    model_env: RERANK_MODEL
    endpoint_path: /rerank
    timeout_seconds: 30
    max_retries: 1

memory:
  require_user_confirmation: true
  require_evidence_for_claims: true
  max_summary_chars: 1800
  default_verification_status: unverified
  enable_light_graph: true
  overlap_limit: 5
  recall_default_limit: 5
  recall_max_limit: 10
  recall_compact_token_budget: 1000
  recall_standard_token_budget: 1500
  capture_min_chars: 12
  ambient_auto_save: true
  trusted_capture_requires_review: true

sources:
  allowlist:
    - name: kilo
      type: kilo_session
      path: G:/LLM
      readonly: true
    - name: codex
      type: codex_session
      path: C:/Users/YING/.codex
      readonly: true
    - name: cherry
      type: cherry_export
      path: G:/LLM/cherry-exports
      readonly: true

export:
  markdown_dir: ./exports/markdown
  json_dir: ./exports/json

webui:
  # Optional single-admin private WebUI. Disabled by default.
  # Expose port 8788 only on trusted networks or behind a VPN/reverse proxy.
  enabled: false
  host: 127.0.0.1
  port: 8788
  web_config_path: ./data/web_config.yaml
  auth_store_path: ./data/webui-auth.json
  secret_store_path: ./data/webui-secrets.json.enc
  # Set only for first bootstrap, then remove the plaintext value from config.yaml.
  initial_password: null
  session_max_age_seconds: 43200

conversation_archive:
  # Keep disabled by default. Does not alter runtime behaviors until explicitly enabled.
  enabled: false
  # Staging directory for unconfirmed imports or testing
  staging_dir: ./exports/conversation-staging
  # Canonical Obsidian Vault root. Set to null until explicitly confirmed.
  vault_root: null
  canonical_subdir: 90_System/AI-Memory
  # Import manifest is archive-local and is always stored at
  # <conversation_root>/.ai-memory/manifest.sqlite.
  index_path: ./data/conversation-index.sqlite
  # Enforce confirmation before writing to vault_root; forbids auto-creating empty vault roots.
  require_explicit_vault_confirmation: true
  copy_embedded_images: false

media_index:
  # No background scanner is started. Resources are indexed only when explicitly
  # submitted, so enabling this does not consume model/GPU resources while idle.
  enabled: true
  index_path: ./data/research-media.sqlite
  max_image_bytes: 33554432
  # Vector generations are managed internally by RMG and are never sent to the
  # embedding provider. Use the WebUI rebuild controls after model/weight changes.
  # Media reuses retrieval.embedding exactly. Image bytes are sent to the same
  # endpoint/model as data: URIs in the existing `input` field. RMG does not
  # probe or maintain a list of models that support image vectors.
